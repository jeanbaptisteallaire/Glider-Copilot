<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>GLIDY Rejeu 3D</title>
    <!-- tuiles : connexions ouvertes pendant le chargement de la trace (orthophoto IGN, Sentinel-2 EOX, relief AWS) -->
    <link rel="preconnect" href="https://data.geopf.fr" crossorigin>
    <link rel="preconnect" href="https://tiles.maps.eox.at" crossorigin>
    <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin>
    <link rel="stylesheet" href="vendor/maplibre-gl-5.15.0.css">
    <link rel="preload" href="vendor/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="replay.css">
</head>
<body>
<main id="scene" aria-label="Rejeu du vol en trois dimensions">
    <div id="map"></div>
    <div id="gesture-layer" aria-label="Zone tactile pour tourner autour du planeur"></div>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-title">Chargement du relief</div>
        <div id="loading-detail">Quelques secondes au premier lancement.</div>
    </div>
    <section id="telemetry" class="glass">
        <div><strong id="altitude">—</strong><span>Altitude</span></div>
        <div><strong id="vario">—</strong><span>Vario m/s</span></div>
        <div><strong id="speed">—</strong><span>Vitesse</span></div>
        <div><strong id="time">00:00</strong><span>Durée</span></div>
    </section>
    <section id="hint" class="glass">Glissez pour tourner · pincez pour zoomer</section>
    <section id="controls" class="glass">
        <button id="play" type="button" aria-label="Lecture ou pause">▶</button>
        <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="Position dans le vol">
        <button id="rate" type="button" aria-label="Vitesse de lecture">4×</button>
        <button id="camera" type="button" aria-label="Recentrer la caméra">◎</button>
    </section>
    <div id="status" role="status"></div>
</main>
<script src="vendor/maplibre-gl-5.15.0.js"></script>
<script type="module" src="replay.mjs"></script>
</body>
</html>
