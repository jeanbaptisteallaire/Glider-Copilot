# iOS / KMP — projet Xcode généré par XcodeGen (`cd ios && xcodegen`). Le .xcodeproj n'est pas versionné.
name: WindGlider
options:
  bundleIdPrefix: com.neutronstar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
configFiles:
  Debug: WindGlider/Config.xcconfig
  Release: WindGlider/Config.xcconfig
targetTemplates:
  WindGliderApp:
    type: application
    platform: iOS
    sources:
      - WindGlider/Sources
      - path: WindGlider/Resources
        optional: true
      # même annuaire FFVP que l'app Android (pas de copie)
      - path: ../app/src/main/assets/clubs_fr.json
        buildPhase: resources
      # vol d'exemple de Mes vols : même fichier que l'app Android
      - path: ../app/src/main/assets/flights/saint-martin-de-londres-vol-synthetique.igc
        buildPhase: resources
      # police Inter et illustrations : mêmes fichiers que l'app Android (pas de copie)
      - path: ../core/designsystem/src/main/res/font
        type: folder
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/wg_cockpit.webp
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/wg_logo.webp
        buildPhase: resources
      # tutoriel : mêmes captures que l'app Android (étapes et textes communs, logic:tutorial)
      - path: ../app/src/main/res/drawable-nodpi/tour_prevol.webp
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/tour_pilotage.webp
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/tour_terrain.webp
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/tour_rec.webp
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/tour_vols.webp
        buildPhase: resources
      - path: ../app/src/main/res/drawable-nodpi/tour_3d.webp
        buildPhase: resources
      - path: ../feature/myflights/src/main/res/drawable-nodpi/wg_flights_header.webp
        buildPhase: resources
      - path: ../feature/myflights/src/main/res/drawable-nodpi/wg_avatar.webp
        buildPhase: resources
      # rejeu 3D : même page que l'app Android (assets replay3d)
      - path: ../feature/replay3d/src/main/assets/replay3d
        type: folder
        buildPhase: resources
      # couverture animée : même page que l'app Android (assets cover)
      - path: ../app/src/main/assets/cover
        type: folder
        buildPhase: resources
      # données d'essai (build de développement, argument -testData) : réponses synthétiques des tests precog
      - path: ../data/precog/src/jvmTest/resources/fixtures
        type: folder
        buildPhase: resources
    info:
      path: WindGlider/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Wind Glider
        CFBundleName: Wind Glider
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "9"
        UILaunchScreen: { UIColorName: LaunchBackground }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        PRECOG_API_KEY: $(PRECOG_API_KEY)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        WG_EDITION: $(WG_EDITION)
        # Google Sign-In : client iOS du projet Google Cloud GLIDY (glidy-510417), client Web = celui de Supabase
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        GIDServerClientID: $(GOOGLE_WEB_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google
            CFBundleURLSchemes: [$(GOOGLE_IOS_URL_SCHEME)]
        NSLocationWhenInUseUsageDescription: "Position GPS du planeur pendant le vol : marge de sécurité, trace IGC et club le plus proche. Elle reste sur le téléphone."
        NSMotionUsageDescription: "Baromètre et accéléromètre du téléphone pour le vario."
        UIBackgroundModes: [location]   # sans audio (App Review 2.5.4, 22/10/2026) : vario et voix au premier plan seulement
        UIAppFonts: [font/inter_regular.ttf, font/inter_medium.ttf, font/inter_semibold.ttf, font/inter_bold.ttf]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: WindGlider/WindGlider.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutronstar.glidercopilot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, WindGliderShared]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z9T8795U78
      configs:
        # archive App Store signée directement (profil de distribution, sans appareil enregistré) : garde les
        # droits du fichier .entitlements (Sign in with Apple). Signer seulement à l'export les perdait (build 1 à 6).
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
        # le framework Kotlin ne cible que iosSimulatorArm64 (Mac Apple Silicon) et iosArm64
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      # archive TestFlight sans iPhone enregistré : certificat « Apple Distribution » + profil App Store (developer.apple.com)
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "WindGlider AppStore"
    preBuildScripts:
      - name: Métier Kotlin (WindGliderShared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

# Éditions (comme Android : même identifiant, édition choisie à la construction ; BuildConfig.LITE ↔ drapeau FULL)
targets:
  WindGlider:
    templates: [WindGliderApp]
    settings:
      base:
        WG_EDITION: lite
  WindGliderFull:
    templates: [WindGliderApp]
    settings:
      base:
        WG_EDITION: full
        PRODUCT_NAME: WindGlider
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) FULL
