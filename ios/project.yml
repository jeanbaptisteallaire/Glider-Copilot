# iOS / KMP — projet Xcode généré par XcodeGen (`cd ios && xcodegen`). Le .xcodeproj n'est pas versionné.
name: WindGlider
options:
  bundleIdPrefix: com.neutronstar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: WindGlider/Config.xcconfig
  Release: WindGlider/Config.xcconfig
targets:
  WindGlider:
    type: application
    platform: iOS
    sources:
      - WindGlider/Sources
      - path: WindGlider/Resources
        optional: true
      # même annuaire FFVP que l'app Android (pas de copie)
      - path: ../app/src/main/assets/clubs_fr.json
        buildPhase: resources
      # données d'essai (build de développement, argument -testData) : réponses synthétiques des tests precog
      - path: ../data/precog/src/jvmTest/resources/fixtures
        type: folder
        buildPhase: resources
    info:
      path: WindGlider/Info.plist
      properties:
        CFBundleDisplayName: Wind Glider
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        PRECOG_API_KEY: $(PRECOG_API_KEY)
        NSLocationWhenInUseUsageDescription: "Position GPS du planeur pendant le vol : marge de sécurité, trace IGC et club le plus proche. Elle reste sur le téléphone."
        NSMotionUsageDescription: "Baromètre et accéléromètre du téléphone pour le vario."
        UIBackgroundModes: [audio, location]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutronstar.windglider.lite
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [$(inherited), -framework, WindGliderShared]
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Métier Kotlin (WindGliderShared)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          if [ -z "$JAVA_HOME" ] && [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
            export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
          fi
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
